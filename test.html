<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; display: flex; height: 100vh; background: #e8e8e8; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 160px;
    background: #f37500;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* Top-left blob */
  .blob-top {
    position: absolute;
    top: -60px;
    left: -60px;
    width: 200px;
    height: 200px;
    background: #fff;
    border-radius: 50%;
    z-index: 0;
  }

  /* Top-right blob that peeks in from the right */
  .blob-top-right {
    position: absolute;
    top: 0px;
    right: -80px;
    width: 170px;
    height: 170px;
    background: #fff;
    border-radius: 50%;
    z-index: 0;
  }

  /* Bottom-left blob */
  .blob-bottom-left {
    position: absolute;
    bottom: 0px;
    left: -80px;
    width: 170px;
    height: 170px;
    background: #fff;
    border-radius: 50%;
    z-index: 0;
  }

  /* Bottom-right blob */
  .blob-bottom-right {
    position: absolute;
    bottom: -60px;
    right: -60px;
    width: 200px;
    height: 200px;
    background: #fff;
    border-radius: 50%;
    z-index: 0;
  }

  /* Logo */
  .logo-wrap {
    position: relative;
    z-index: 1;
    margin-top: 90px;
    margin-left: 20px;
    margin-bottom: 30px;
  }
  .logo-circle {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #cc6600;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo-inner {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #f37500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .logo-inner span {
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    text-align: center;
  }

  /* Nav items */
  .nav {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 0 12px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(0,0,0,0.12); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* Bottom nav pushed to bottom */
  .bottom-nav {
    position: relative;
    z-index: 1;
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 0 12px;
    padding-bottom: 80px;
  }

  /* ── MAIN CONTENT ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #f0f0f0;
  }
  .topbar {
    padding: 12px 20px;
    background: #f0f0f0;
  }
  .topbar h2 {
    font-size: 15px;
    font-weight: 600;
    color: #333;
  }
  .list {
    flex: 1;
    overflow-y: auto;
  }
  .list-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f9f9f9;
    border-bottom: 1px solid #e2e2e2;
    padding: 10px 16px;
  }
  .list-row:nth-child(even) { background: #f0f0f0; }
  .col-name { flex: 1.4; }
  .col-name .name { font-size: 13px; font-weight: 600; color: #333; }
  .col-name .date { font-size: 11px; color: #888; margin-top: 2px; }
  .col-amt { flex: 1.2; }
  .col-amt .amount { font-size: 13px; font-weight: 600; color: #333; }
  .col-amt .date { font-size: 11px; color: #888; margin-top: 2px; }
  .eye-icon { color: #f37500; }
  .eye-icon svg { width: 24px; height: 16px; fill: none; stroke: #f37500; stroke-width: 1.8; display: block; }
  .resto-btn {
    background: #f37500;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 5px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .more-dots {
    font-size: 18px;
    color: #888;
    cursor: pointer;
    line-height: 1;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <!-- blobs -->
  <div class="blob-top"></div>
  <div class="blob-top-right"></div>
  <div class="blob-bottom-left"></div>
  <div class="blob-bottom-right"></div>

  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-circle">
      <div class="logo-inner">
        <span>Soya<br>Numa</span>
      </div>
    </div>
  </div>

  <!-- Top nav -->
  <nav class="nav">
    <a class="nav-item" href="#">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5">
        <rect x="1" y="1" width="5.5" height="5.5" rx="1"/>
        <rect x="9.5" y="1" width="5.5" height="5.5" rx="1"/>
        <rect x="1" y="9.5" width="5.5" height="5.5" rx="1"/>
        <rect x="9.5" y="9.5" width="5.5" height="5.5" rx="1"/>
      </svg>
      overview
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5">
        <path d="M2 6l6-5 6 5v8a1 1 0 01-1 1H3a1 1 0 01-1-1z"/>
      </svg>
      Clients
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5">
        <circle cx="8" cy="5" r="3"/>
        <path d="M2 15c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      </svg>
      Users
    </a>
  </nav>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <a class="nav-item" href="#">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5">
        <circle cx="8" cy="8" r="2.5"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4"/>
      </svg>
      settings
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5">
        <circle cx="8" cy="5" r="3"/>
        <path d="M2 15c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      </svg>
      My account
    </a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">
  <div class="topbar"><h2>overview</h2></div>
  <div class="list" id="list"></div>
</div>

<script>
  const list = document.getElementById('list');
  for (let i = 0; i < 12; i++) {
    const row = document.createElement('div');
    row.className = 'list-row';
    row.innerHTML = `
      <div class="col-name">
        <div class="name">Soy restaurant</div>
        <div class="date">on 24.05.2025</div>
      </div>
      <div class="col-amt">
        <div class="amount">238900Frw</div>
        <div class="date">on 24.05.2025</div>
      </div>
      <div class="eye-icon">
        <svg viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 8C1 8 5 1 12 1s11 7 11 7-4 7-11 7S1 8 1 8z"/>
          <circle cx="12" cy="8" r="3"/>
        </svg>
      </div>
      <button class="resto-btn">Resto</button>
      <span class="more-dots">&#8942;</span>
    `;
    list.appendChild(row);
  }
</script>
</body>
</html>
